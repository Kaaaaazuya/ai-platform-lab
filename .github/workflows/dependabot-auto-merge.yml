# Dependabot のパッチ更新を、CI が通ったら自動でマージする（ADR-013）。
# - 対象は、dependabot.yml でグループ名を *-patch にしたPRだけ。マイナーとメジャーは人が見る
# - ci の実行が成功で終わったあとに動くので、CI より先にマージされることはない
# - PRのコードは取り出さない。ブランチ名と、PRの作成者とコミットだけを見る
name: dependabot-auto-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: パッチ更新のPRをマージする
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            */npm-patch-* | */actions-patch-* | */compose-patch-* | */docker-patch-* | */terraform-patch-* | */docs-python-patch-*) ;;
            *) echo "パッチのグループではないので、マージしない: $BRANCH"; exit 0 ;;
          esac
          pr=$(gh pr list --head "$BRANCH" --state open --json number,author,headRefOid --jq '.[0] // empty')
          if [[ -z "$pr" ]]; then echo "開いているPRがない"; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          author=$(jq -r .author.login <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          if [[ "$author" != "app/dependabot" && "$author" != "dependabot[bot]" ]]; then
            echo "作成者が Dependabot ではないので、マージしない: $author"; exit 0
          fi
          if [[ "$head" != "$HEAD_SHA" ]]; then
            echo "CI の後にコミットが増えたので、マージしない"; exit 0
          fi
          gh pr merge "$number" --squash --match-head-commit "$HEAD_SHA"
