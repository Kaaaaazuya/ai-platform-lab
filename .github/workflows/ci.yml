name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じPRへ続けてプッシュしたら、前の実行を取り消す（ADR-013）。
# main へのプッシュは実行ごとに別のグループにして、待っている実行が後の実行に置き換えられないようにする
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ADR-013: ツールは版とハッシュを固定して取得する
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  HADOLINT_VERSION: 2.15.1
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507

jobs:
  # 変更されたファイルから、動かすジョブを決める（scripts/ci-changes.sh）
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.diff.outputs.node }}
      docs: ${{ steps.diff.outputs.docs }}
      terraform: ${{ steps.diff.outputs.terraform }}
      shell: ${{ steps.diff.outputs.shell }}
      workflows: ${{ steps.diff.outputs.workflows }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-changes.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  # シークレットの検出は軽いので、毎回すべての履歴を見る
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan history
        run: /tmp/gitleaks git --redact --no-banner -v .

  # npm ci を1回だけにして、Node.js が要る検査をまとめて流す
  node:
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODE: ${{ needs.changes.outputs.node }}
      DOCS: ${{ needs.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci
      # サプライチェーン（ADR-013）
      - name: Registry signatures
        if: env.CODE == 'true'
        run: npm audit signatures
      - name: Vulnerabilities (high and above)
        if: env.CODE == 'true'
        run: npm audit --audit-level=high
      - name: Install scripts allowlist
        if: env.CODE == 'true'
        run: node scripts/check-install-scripts.mjs
      # コード
      - name: Biome
        if: env.CODE == 'true'
        run: npx biome ci .
      - name: Typecheck
        if: env.CODE == 'true'
        run: npm run typecheck
      - name: Test
        if: env.CODE == 'true'
        run: npm test
      - name: Build
        if: env.CODE == 'true'
        run: npm run build
      # ADR-008: 評価はLLMが要るのでローカルで実行し、レポートをコミットする。CIは差分だけを見る
      - name: RAG evaluation diff
        if: env.CODE == 'true'
        run: npm run -s eval:compare -w app/api
      # 人が読む文章（docs/writing-guide.md）
      - name: textlint
        if: env.DOCS == 'true'
        run: npm run lint:text

  # ドキュメントサイトがビルドできるかを、マージの前に確かめる（公開は pages.yml）
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  # シェル・ワークフロー・Dockerfile の検査。変わったものだけを見る
  static:
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        if: needs.changes.outputs.shell == 'true'
        run: shellcheck scripts/*.sh
      - name: actionlint
        if: needs.changes.outputs.workflows == 'true'
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - name: hadolint
        if: needs.changes.outputs.docker == 'true'
        run: |
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          /tmp/hadolint infra/aws-emulator/Dockerfile

  terraform-static:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/envs/local init -backend=false -input=false
      - run: terraform -chdir=terraform/envs/local validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: terraform

  # ADR-006: PRごとに AWS Emulator へ apply してスモークテスト。
  # 配布元のURL（リポジトリ変数 AWS_EMULATOR_DEB_URL）がなければ、ジョブごと動かさない
  terraform-emulator:
    needs: terraform-static
    if: vars.AWS_EMULATOR_DEB_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EMULATOR_DEB_URL: ${{ vars.AWS_EMULATOR_DEB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Install AWS Emulator
        run: |
          curl -fsSL -o /tmp/aws-emulator.deb "$AWS_EMULATOR_DEB_URL"
          sudo apt-get install -y /tmp/aws-emulator.deb
      - name: Start emulator
        run: |
          nohup aws-emulator -p 9297 --telemetry off > /tmp/emulator.log 2>&1 &
          ./scripts/wait-emulator.sh
      - name: Apply to emulator
        run: |
          source scripts/emulator-env.sh
          terraform -chdir=terraform/envs/local init -input=false
          terraform -chdir=terraform/envs/local apply -auto-approve -input=false
      - name: Smoke test
        run: |
          source scripts/emulator-env.sh
          aws dynamodb describe-table --table-name ai-platform-lab-conversations --query 'Table.TableStatus'
          aws s3api head-bucket --bucket ai-platform-lab-docs
      - name: Emulator log
        if: failure()
        run: tail -n 200 /tmp/emulator.log
