name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # ADR-013: ツールは版とハッシュを固定して取得する
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  HADOLINT_VERSION: 2.15.1
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan history
        run: /tmp/gitleaks git --redact --no-banner -v .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci .
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - name: hadolint
        run: |
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          /tmp/hadolint infra/aws-emulator/Dockerfile

  # ADR-013: npm のサプライチェーン
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci
      - name: Registry signatures
        run: npm audit signatures
      - name: Vulnerabilities (high and above)
        run: npm audit --audit-level=high
      - name: Install scripts allowlist
        run: node scripts/check-install-scripts.mjs

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/envs/local init -backend=false -input=false
      - run: terraform -chdir=terraform/envs/local validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: terraform

  # ADR-006: PRごとに AWS Emulator へ apply してスモークテスト
  terraform-emulator:
    needs: terraform-static
    runs-on: ubuntu-latest
    env:
      AWS_EMULATOR_DEB_URL: ${{ vars.AWS_EMULATOR_DEB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Install AWS Emulator
        run: |
          if [ -z "$AWS_EMULATOR_DEB_URL" ]; then
            echo "::warning::repo variable AWS_EMULATOR_DEB_URL is not set; skipping emulator job"
            echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          curl -fsSL -o /tmp/aws-emulator.deb "$AWS_EMULATOR_DEB_URL"
          sudo apt-get install -y /tmp/aws-emulator.deb
      - name: Start emulator
        if: env.SKIP != '1'
        run: |
          nohup aws-emulator -p 9297 --telemetry off > /tmp/emulator.log 2>&1 &
          ./scripts/wait-emulator.sh
      - name: Apply to emulator
        if: env.SKIP != '1'
        run: |
          source scripts/emulator-env.sh
          terraform -chdir=terraform/envs/local init -input=false
          terraform -chdir=terraform/envs/local apply -auto-approve -input=false
      - name: Smoke test
        if: env.SKIP != '1'
        run: |
          source scripts/emulator-env.sh
          aws dynamodb describe-table --table-name ai-platform-lab-conversations --query 'Table.TableStatus'
          aws s3api head-bucket --bucket ai-platform-lab-docs
      - name: Emulator log
        if: failure() && env.SKIP != '1'
        run: tail -n 200 /tmp/emulator.log
