# コミット前・プッシュ前のチェック（ADR-013）。`task hooks` で有効にする
# 必要なツール: brew install lefthook gitleaks shellcheck actionlint hadolint tflint
pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner
    - name: biome
      glob: "*.{ts,tsx,js,json,css}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: textlint
      glob: "{README.md,docs/**/*.md}"
      run: npx textlint {staged_files}
    - name: terraform-fmt
      glob: "*.tf"
      run: terraform fmt {staged_files}
      stage_fixed: true
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    - name: hadolint
      glob: "**/Dockerfile"
      run: hadolint {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: test
      run: npm test
